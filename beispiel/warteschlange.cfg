# Kleinstes Beispiel: Ankünfte -> Warteschlange -> Bedienung -> Ausgang

Define ExponentialDistribution { Ankunftsabstand Bedienzeit }
Define SimEntity { Kunde }
Define EntityGenerator { Ankunft }
Define Queue { Warteschlange }
Define Server { Schalter }
Define EntitySink { Ausgang }

Simulation RunDuration { 1000 h }
Simulation PrintReport { TRUE }

Ankunftsabstand UnitType { TimeUnit }
Ankunftsabstand Mean { 10 min }
Ankunftsabstand RandomSeed { 1 }

Bedienzeit UnitType { TimeUnit }
Bedienzeit Mean { 8 min }
Bedienzeit RandomSeed { 2 }

Ankunft NextComponent { Warteschlange }
Ankunft InterArrivalTime { Ankunftsabstand }
Ankunft PrototypeEntity { Kunde }

Schalter NextComponent { Ausgang }
Schalter WaitQueue { Warteschlange }
Schalter ServiceTime { Bedienzeit }
